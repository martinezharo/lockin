<!doctype html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="utf-8" />
  <title>Contained — Lock In</title>
  <link rel="stylesheet" href="../../styles/fonts.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/base.css" />
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <main class="card">
    <div class="goblin" aria-hidden="true">👹</div>

    <h1 id="domainName">this forbidden tunnel</h1>
    <p id="statusLine" class="status-line">is contained</p>

    <!-- Only drawn when something is actually on the clock: a zone held shut
         by a spent allowance knows midnight, a scheduled one knows its hour,
         and a zone contained around the clock knows nothing worth promising. -->
    <div id="countdown" class="countdown" hidden>
      <div class="countdown-value" id="countdownValue"></div>
      <div class="countdown-label" id="countdownLabel"></div>
    </div>

    <div id="strip" class="strip" hidden>
      <div class="band">
        <span id="stripFills"></span>
        <span id="stripNow" class="band-now"></span>
      </div>
      <div class="band-scale" aria-hidden="true">
        <span>00</span><span>06</span><span>12</span><span>18</span><span>24</span>
      </div>
    </div>

    <!-- The scoreboard. Counted by this page, because declarativeNetRequest
         does the redirect without waking anything else up. -->
    <div id="tally" class="tally" hidden>
      <span class="tally-count" id="tallyCount"></span>
      <span class="tally-text">
        <span class="tally-line" id="tallyLine"></span>
        <span class="tally-sub" id="tallySub"></span>
      </span>
    </div>

    <p id="flavorText" class="flavor"></p>

    <div class="actions">
      <button id="backBtn" class="primary">Return to the mines ⛏️</button>
      <button id="dashBtn" class="ghost">File an appeal</button>
    </div>
  </main>

  <script type="module" src="blocked.js"></script>
</body>
</html>
