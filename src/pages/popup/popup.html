<!doctype html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="utf-8" />
  <title>Lock In</title>
  <link rel="stylesheet" href="../../styles/fonts.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/base.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="../../../icons/icon48.png" alt="" width="22" height="22" />
      <span class="brand-title">Lock In</span>
      <span class="brand-lock" id="brandLock" aria-hidden="true"></span>
    </div>

    <!-- The next gate, not a count of things. A number of "zones active" is
         trivia; the minutes until something opens is the reason anyone clicks
         the toolbar icon. -->
    <div id="nextPanel" class="next-panel" hidden>
      <div class="next-value" id="nextValue"></div>
      <div class="next-label" id="nextLabel"></div>
      <div class="next-clock" id="nextClock"></div>
    </div>

    <div id="zoneList" class="zone-list"></div>
    <p id="emptyState" class="empty" hidden>no zones yet 🐭</p>

    <div id="lockRow" class="lock-row">checking containment…</div>
    <div id="serviceRow" class="service-row">checking local watchdog…</div>

    <button id="openDash" class="primary">Open containment HQ</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
