<!doctype html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="utf-8" />
  <title>Lock In</title>
  <link rel="stylesheet" href="../../styles/fonts.css" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/base.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="../../../icons/icon48.png" alt="" width="22" height="22" />
      <span>Lock In</span>
    </div>

    <div id="stats" class="stats">
      <div class="stat">
        <span class="num" id="statGroups">–</span>
        <span class="label">zones active</span>
      </div>
      <div class="stat">
        <span class="num" id="statDomains">–</span>
        <span class="label">tunnels sealed</span>
      </div>
    </div>

    <div id="lockRow" class="lock-row">checking containment…</div>
    <div id="devBanner" class="dev-banner" hidden>⚡ dev mammal has admin powers</div>

    <button id="openDash" class="primary">Open containment HQ</button>
  </div>

  <!-- Plain script on purpose: env.js is git-ignored and optional, and a
       missing module import would take the whole page down with it. -->
  <script src="../../../env.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
