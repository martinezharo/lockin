name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refuse a tag that disagrees with the manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          manifest="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version")"
          tag="${GITHUB_REF_NAME#v}"
          test "$manifest" = "$tag" || { echo "manifest $manifest does not match tag $tag"; exit 1; }
      - name: Run the release checks and the extension suite
        run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/lock-in-*-chrome-web-store.zip*
          if-no-files-found: error

  watchdog:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove three-heartbeat arming and fail-closed activation in safe mode
        run: node scripts/test-watchdog.mjs
      - name: Build the reproducible watchdog bundle
        shell: powershell
        run: ./scripts/build-windows-watchdog-bundle.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: watchdog
          path: dist/lock-in-*-windows-watchdog.zip*
          if-no-files-found: error

  publish:
    needs: [extension, watchdog]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the archives and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Install both archives as described in the [README](https://github.com/martinezharo/lockin#install)."
            echo
            echo '## SHA-256'
            echo
            echo '```'
            cat dist/*.sha256
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Lock In ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            dist/lock-in-*-chrome-web-store.zip \
            dist/lock-in-*-chrome-web-store.zip.sha256 \
            dist/lock-in-*-windows-watchdog.zip \
            dist/lock-in-*-windows-watchdog.zip.sha256

  store:
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: dist
      - name: Skip when the Chrome Web Store credentials are not configured
        id: creds
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
        run: |
          if [ -z "$CWS_CLIENT_ID" ] || [ -z "$CWS_CLIENT_SECRET" ] || [ -z "$CWS_REFRESH_TOKEN" ] || [ -z "$CWS_ITEM_ID" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Chrome Web Store secrets are absent; the GitHub release stands on its own.'
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the package and submit it for review
        if: steps.creds.outputs.configured == 'true'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
        run: |
          set -euo pipefail
          archive="$(ls dist/lock-in-*-chrome-web-store.zip)"

          token="$(curl -sS --fail-with-body https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" \
            -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" \
            -d grant_type=refresh_token | jq -r '.access_token')"
          test -n "$token" -a "$token" != null || { echo 'the refresh token was rejected; a Testing OAuth consent screen expires it after 7 days'; exit 1; }

          upload="$(curl -sS --fail-with-body -X PUT \
            -H "Authorization: Bearer $token" -H 'x-goog-api-version: 2' \
            -T "$archive" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_ITEM_ID")"
          echo "$upload" | jq .
          test "$(echo "$upload" | jq -r '.uploadState')" = SUCCESS || { echo 'the upload was refused'; exit 1; }

          publish="$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $token" -H 'x-goog-api-version: 2' -H 'Content-Length: 0' \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_ITEM_ID/publish")"
          echo "$publish" | jq .
          echo "$publish" | jq -e '.status | index("OK") or index("ITEM_PENDING_REVIEW")' > /dev/null \
            || { echo 'the store refused to publish this version'; exit 1; }
          echo '::notice::Submitted to the Chrome Web Store; existing unlisted visibility is retained.'
