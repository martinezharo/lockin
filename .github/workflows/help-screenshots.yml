name: Help dialog screenshots

on:
  pull_request:
    paths:
      - 'src/pages/options/**'
      - 'tests/ui/help-screenshots.mjs'
      - '.github/workflows/help-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start the existing mocked UI server
        run: node scripts/serve-ui-test.mjs > /tmp/lockin-ui.log 2>&1 &
      - name: Verify dialogs and capture screenshots
        run: node tests/ui/help-screenshots.mjs
      - name: Attach screenshots to PR checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: help-dialog-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
