name: Help dialog screenshots

on:
  pull_request:
    paths:
      - 'src/pages/**'
      - 'src/styles/**'
      - 'src/shared/**'
      - 'tests/ui/**'
      - '.github/workflows/help-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Install the colour emoji font used by screenshot Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-color-emoji
          fc-match -f '%{family}\n' 'Noto Color Emoji' | grep -F 'Noto Color Emoji'
      - name: Check existing unit tests
        run: node --test tests/*.test.mjs
      - name: Start the existing mocked UI server
        run: node scripts/serve-ui-test.mjs > /tmp/lockin-ui.log 2>&1 &
      - name: Verify dialogs, visual regressions, and capture screenshots
        run: |
          node tests/ui/help-screenshots.mjs
          node tests/ui/polish-regressions.mjs
      - name: Attach screenshots to PR checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: help-dialog-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
      - name: Include screenshots directly in PR branch
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          PR_HEAD: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$PR_HEAD"
          git switch -C "$PR_HEAD" "origin/$PR_HEAD"
          git add screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "📸 docs: refresh real UI screenshots [skip ci]"
            git push origin "HEAD:$PR_HEAD"
          fi
