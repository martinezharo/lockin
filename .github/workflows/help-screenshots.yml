name: UI browser checks

on:
  pull_request:
    paths:
      - 'src/pages/**'
      - 'src/styles/**'
      - 'src/shared/**'
      - 'tests/ui/**'
      - '.github/workflows/help-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Install the colour emoji font used by screenshot Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-color-emoji
          fc-match -f '%{family}\n' 'Noto Color Emoji' | grep -F 'Noto Color Emoji'
      - name: Check existing unit tests
        run: node --test tests/*.test.mjs
      - name: Start the existing mocked UI server
        run: node scripts/serve-ui-test.mjs > /tmp/lockin-ui.log 2>&1 &
      - name: Verify dialogs, visual regressions, and capture temporary screenshots
        run: |
          node tests/ui/help-screenshots.mjs
          node tests/ui/polish-regressions.mjs
      - name: Attach temporary screenshots to the workflow run (never commit them)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: help-dialog-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
